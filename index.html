<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>יומן</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/main.js" defer></script>
</head>
<body>
    <!-- Password View -->
    <div id="password-view" class="view-screen">
        <div class="password-container">
            <input type="password" id="password-input" inputmode="numeric" pattern="[0-9]*" placeholder="הזן קוד סודי">
            <button id="password-submit-btn">כניסה</button>
        </div>
    </div>

    <!-- Journals List View (hidden by default) -->
    <div id="journals-list-view" class="view-screen" style="display: none;">
        <header>
            <h1>היומנים שלי</h1>
        </header>
        <main>
            <div id="journals-list-container">
                <!-- Dynamically populated -->
            </div>
        </main>
        <button id="add-journal-fab">+</button>
    </div>

    <!-- Timeline View (hidden by default) -->
    <div id="timeline-view" class="view-screen" style="display: none;">
        <header class="timeline-top-bar">
            <button id="back-to-journals-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-arrow-right"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
            </button>
            <button id="search-toggle-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-search"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            </button>
        </header>
        <h1 id="main-title"></h1> <!-- Title will be set dynamically -->
        <div class="search-bar-container">
            <input type="search" id="search-input" placeholder="חיפוש">
        </div>
        <main id="journal-feed">
            <!-- Journal Entry Cards will be populated here -->
        </main>
        <button id="fab">+</button>
    </div>

    <!-- Entry Composer View (Initially hidden) -->
    <div id="composer-view">
        <!-- Composer content will be added here -->
    </div>
</body>
</html>
