<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>יומן</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&family=Bebas+Neue&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <!-- Firebase SDKs (v9 Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <!-- Chart.js via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.0/chart.umd.min.js"></script>
    <script src="js/main.js" defer></script>
</head>
<body>
    <!-- Password View -->
    <div id="password-view" class="view-screen">
        <div id="splash-screen">
            <div class="logo-container">
                <i class="fas fa-moon moon-icon"></i>
                <div class="stars">
                    <i class="fas fa-star star-1"></i>
                    <i class="fas fa-heart heart-star"></i>
                    <i class="fas fa-star star-2"></i>
                </div>
            </div>
            <h1 class="splash-title">Luna</h1>
            <p class="splash-subtitle">זיכרונות ורגעים</p>
        </div>
        <div class="password-container">
            <input type="password" id="password-input" inputmode="numeric" pattern="[0-9]*">
            <button id="password-submit-btn">כניסה</button>
        </div>
    </div>

    <!-- Journals List View (hidden by default) -->
    <div id="journals-list-view" class="view-screen" style="display: none;">
        <header class="journals-list-header">
            <button id="lock-app-btn" class="header-action-btn">
                <i class="fas fa-lock"></i>
            </button>
            <h1 class="journals-list-title"></h1>
            <button id="show-all-entries-btn" class="header-action-btn">
                <i class="fas fa-list"></i>
            </button>
            <button id="journals-list-edit-btn" class="header-action-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-edit-2"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path></svg>
            </button>
            <button id="journals-list-done-btn" class="header-action-btn" style="display: none;">סיום</button>
        </header>
        <div id="insights-widget-container">
            <!-- Insights widget will be dynamically inserted here -->
        </div>
        <main>
            <div id="journals-list-container">
                <!-- Dynamically populated -->
            </div>
        </main>
        <button id="add-journal-fab">+</button>
    </div>

    <!-- Timeline View (hidden by default) -->
    <div id="timeline-view" class="view-screen" style="display: none;">
        <header class="timeline-top-bar">
            <button id="back-to-journals-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-arrow-right"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
            </button>
            <button id="search-toggle-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-search"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            </button>
        </header>
        <h1 id="main-title"></h1> <!-- Title will be set dynamically -->
        <div class="search-bar-container">
            <input type="search" id="search-input" placeholder="חיפוש">
        </div>
        <main id="journal-feed">
            <!-- Journal Entry Cards will be populated here -->
        </main>
        <button id="fab">+</button>
    </div>

    <!-- Insights View (hidden by default) -->
    <div id="insights-view" class="view-screen" style="display: none;">
        <header class="timeline-top-bar">
             <button id="back-to-journals-from-insights-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-arrow-right"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
            </button>
            <h1 class="insights-title">Insights</h1>
             <span></span> <!-- Spacer -->
        </header>
        <main class="insights-content">
            <div class="insights-main-stats">
                <div class="stat-card expandable entries-year" data-stat="entries">
                    <div class="stat-card-inner">
                        <div class="stat-card-main">
                            <!-- Default content populated by JS -->
                        </div>
                        <div class="stat-card-expanded">
                            <!-- Expanded content populated by JS -->
                        </div>
                    </div>
                </div>
                <div class="stat-card expandable days-journaled" data-stat="journaled">
                     <div class="stat-card-inner">
                        <div class="stat-card-main">
                            <!-- Default content populated by JS -->
                        </div>
                        <div class="stat-card-expanded">
                            <!-- Expanded content populated by JS -->
                        </div>
                    </div>
                </div>
                <div class="stat-card expandable words-written" data-stat="written">
                     <div class="stat-card-inner">
                        <div class="stat-card-main">
                            <!-- Default content populated by JS -->
                        </div>
                        <div class="stat-card-expanded">
                            <!-- Expanded content populated by JS -->
                        </div>
                    </div>
                </div>
            </div>
            <div class="insights-calendar">
                <div class="calendar-header">
                    <button id="prev-month-btn">&lt;</button>
                    <h2 id="month-year-display"></h2>
                    <button id="next-month-btn">&gt;</button>
                </div>
                <div class="calendar-grid" id="calendar-grid">
                    <!-- Calendar days will be populated here -->
                </div>
            </div>
             <div id="entries-for-date-view">
                <!-- Entries for a selected date will be shown here -->
            </div>
        </main>
    </div>

    <!-- Entry Composer View (Initially hidden) -->
    <div id="composer-view">
        <!-- Composer content will be added here -->
    </div>

    <!-- Custom Modal for New Journal -->
    <div id="new-journal-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h2>יומן חדש</h2>
            <p>הזן שם ליומן החדש:</p>
            <input type="text" id="new-journal-name-input" dir="rtl">
            <div class="modal-actions">
                <button id="cancel-new-journal-btn">ביטול</button>
                <button id="create-new-journal-btn">צור</button>
            </div>
        </div>
    </div>

    <!-- Graph View (hidden by default) -->
    <div id="graph-view" class="view-screen" style="display: none;">
        <header class="timeline-top-bar">
             <button id="back-to-timeline-from-graph-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-arrow-right"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
            </button>
            <h1 class="graph-title">Weight Graph</h1>
             <span></span> <!-- Spacer -->
        </header>
        <main class="graph-content">
            <div class="chart-container">
                <canvas id="weight-chart"></canvas>
            </div>
            <div class="graph-filters">
                <button class="filter-btn active" data-range="1m">1M</button>
                <button class="filter-btn" data-range="3m">3M</button>
                <button class="filter-btn" data-range="6m">6M</button>
                <button class="filter-btn" data-range="1y">1Y</button>
                <button class="filter-btn" data-range="all">All</button>
            </div>
        </main>
    </div>
</body>
</html>
