<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Journal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/swiper/swiper-bundle.min.css" />
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/swiper/swiper-bundle.min.js"></script>
    <script src="js/main.js" defer></script>
</head>
<body>
    <!-- Screen 1: Timeline View -->
    <div id="timeline-view">
        <header id="timeline-header">
            <h1 id="main-title">Journal</h1>
        </header>
        <main id="journal-feed">
            <!-- Journal Entry Cards will be populated here -->
        </main>
        <button id="fab">+</button>
    </div>

    <!-- Screen 2: Entry Composer View (Initially hidden) -->
    <div id="composer-view">
        <!-- Composer content will be added here -->
    </div>
</body>
</html>
