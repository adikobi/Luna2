<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>יומן</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&family=Bebas+Neue&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="css/style.css?v=1728935092">
    <!-- Firebase SDKs (v9 Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <!-- Chart.js via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.0/chart.umd.min.js"></script>
    <!-- Chart.js Date Adapter (Bundled with a compatible date-fns) -->
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="js/main.js" defer></script>
</head>
<body class="loading">
    <!-- Auth View -->
    <div id="auth-view" class="view-screen">
        <div id="auth-container">
            <h1 class="auth-title">Luna</h1>
            <div class="auth-toggle">
                <button id="show-login-btn" class="active">כניסה</button>
                <button id="show-signup-btn">הרשמה</button>
            </div>

            <!-- Login Form -->
            <div id="login-form">
                <input type="text" id="login-email-username" placeholder="אימייל או שם משתמש" autocomplete="email">
                <input type="password" id="login-password" placeholder="סיסמה" autocomplete="current-password">
                <button id="login-btn">כניסה</button>
                <a href="#" id="forgot-password-link">שכחתי סיסמה</a>
            </div>

            <!-- Signup Form (hidden by default) -->
            <div id="signup-form" style="display: none;">
                <input type="text" id="signup-username" placeholder="שם משתמש" autocomplete="username">
                <input type="email" id="signup-email" placeholder="אימייל" autocomplete="email">
                <input type="password" id="signup-password" placeholder="סיסמה" autocomplete="new-password">
                <button id="signup-btn">הרשמה</button>
            </div>
        </div>
    </div>

    <!-- PIN Setup View -->
    <div id="pin-setup-view" class="view-screen" style="display: none;">
        <div class="pin-container">
            <h2>הגדר קוד PIN</h2>
            <p>הזן קוד בן 4 ספרות לכניסה מהירה.</p>
            <input type="password" id="pin-setup-input" inputmode="numeric" pattern="[0-9]*" maxlength="4">
            <button id="pin-setup-btn">הגדר</button>
        </div>
    </div>

    <!-- PIN View -->
    <div id="pin-view" class="view-screen" style="display: none;">
         <div id="splash-screen">
            <div class="logo-container">
                <i class="fas fa-moon moon-icon"></i>
                <div class="stars">
                    <i class="fas fa-star star-1"></i>
                    <i class="fas fa-heart heart-star"></i>
                    <i class="fas fa-star star-2"></i>
                </div>
            </div>
            <h1 class="splash-title">Luna</h1>
            <p class="splash-subtitle">זיכרונות ורגעים</p>
        </div>
        <div class="password-container">
            <input type="password" id="pin-input" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off">
            <button id="pin-submit-btn">כניסה</button>
        </div>
        <button id="logout-btn" class="text-btn">התנתק</button>
    </div>

    <!-- Journals List View (hidden by default) -->
    <div id="journals-list-view" class="view-screen" style="display: none;">
        <header class="journals-list-header">
            <button id="lock-app-btn" class="header-action-btn">
                <i data-lucide="lock"></i>
            </button>
            <h1 class="journals-list-title"></h1>
            <button id="backup-btn" class="header-action-btn">
                <i data-lucide="save"></i>
            </button>
            <button id="show-all-entries-btn" class="header-action-btn">
                <i data-lucide="list"></i>
            </button>
            <button id="journals-list-edit-btn" class="header-action-btn">
                <i data-lucide="pencil"></i>
            </button>
            <button id="journals-list-done-btn" class="header-action-btn" style="display: none;">סיום</button>
        </header>
        <div id="insights-widget-container">
            <!-- Insights widget will be dynamically inserted here -->
        </div>
        <main>
            <div id="journals-list-container">
                <!-- Dynamically populated -->
            </div>
        </main>
        <button id="add-journal-fab">+</button>
    </div>

    <!-- Timeline View (hidden by default) -->
    <div id="timeline-view" class="view-screen" style="display: none;">
        <header class="timeline-top-bar">
            <button id="back-to-journals-btn">
                <i data-lucide="redo"></i>
            </button>
            <button id="search-toggle-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-search"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            </button>
        </header>
        <h1 id="main-title"></h1> <!-- Title will be set dynamically -->
        <div class="search-bar-container">
            <input type="search" id="search-input" placeholder="חיפוש">
        </div>
        <main id="journal-feed">
            <!-- Journal Entry Cards will be populated here -->
        </main>
        <button id="fab">+</button>
    </div>

    <!-- Insights View (hidden by default) -->
    <div id="insights-view" class="view-screen" style="display: none;">
        <header class="timeline-top-bar">
             <button id="back-to-journals-from-insights-btn">
                <i data-lucide="redo"></i>
            </button>
            <h1 class="insights-title">Insights</h1>
             <span></span> <!-- Spacer -->
        </header>
        <main class="insights-content">
            <div class="insights-main-stats">
                <div class="stat-card expandable entries-year" data-stat="entries">
                    <div class="stat-card-inner">
                        <div class="stat-card-main">
                            <!-- Default content populated by JS -->
                        </div>
                        <div class="stat-card-expanded">
                            <!-- Expanded content populated by JS -->
                        </div>
                    </div>
                </div>
                <div class="stat-card expandable days-journaled" data-stat="journaled">
                     <div class="stat-card-inner">
                        <div class="stat-card-main">
                            <!-- Default content populated by JS -->
                        </div>
                        <div class="stat-card-expanded">
                            <!-- Expanded content populated by JS -->
                        </div>
                    </div>
                </div>
                <div class="stat-card expandable words-written" data-stat="written">
                     <div class="stat-card-inner">
                        <div class="stat-card-main">
                            <!-- Default content populated by JS -->
                        </div>
                        <div class="stat-card-expanded">
                            <!-- Expanded content populated by JS -->
                        </div>
                    </div>
                </div>
            </div>
            <div class="insights-calendar">
                <div class="calendar-header">
                    <button id="prev-month-btn">&lt;</button>
                    <h2 id="month-year-display"></h2>
                    <button id="next-month-btn">&gt;</button>
                </div>
                <div class="calendar-grid" id="calendar-grid">
                    <!-- Calendar days will be populated here -->
                </div>
            </div>
             <div id="entries-for-date-view">
                <!-- Entries for a selected date will be shown here -->
            </div>
        </main>
    </div>

    <!-- Entry Composer View (Initially hidden) -->
    <div id="composer-view">
        <!-- Composer content will be added here -->
    </div>

    <!-- Custom Modal for New Journal -->
    <div id="new-journal-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h2>יומן חדש</h2>
            <p>הזן שם ליומן החדש:</p>
            <input type="text" id="new-journal-name-input" dir="rtl">
            <div class="modal-actions">
                <button id="cancel-new-journal-btn">ביטול</button>
                <button id="create-new-journal-btn">צור</button>
            </div>
        </div>
    </div>

    <!-- Graph View (hidden by default) -->
    <div id="graph-view" class="view-screen" style="display: none;">
        <header class="timeline-top-bar">
             <button id="back-to-timeline-from-graph-btn">
                <i data-lucide="redo"></i>
            </button>
            <h1 class="graph-title">Weight Graph</h1>
             <span></span> <!-- Spacer -->
        </header>
        <main class="graph-content">
            <div class="chart-container">
                <canvas id="weight-chart"></canvas>
            </div>
            <div class="graph-filters">
                <button class="filter-btn active" data-range="1m">1M</button>
                <button class="filter-btn" data-range="3m">3M</button>
                <button class="filter-btn" data-range="6m">6M</button>
                <button class="filter-btn" data-range="1y">1Y</button>
                <button class="filter-btn" data-range="all">All</button>
            </div>
        </main>
    </div>

    <!-- Emoji Picker Modal -->
    <div id="emoji-picker-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h2>בחר/י רגש</h2>
            <div id="emoji-options-container">
                <!-- Emojis will be populated here by JS -->
            </div>
            <div class="modal-actions">
                <button id="cancel-emoji-picker-btn">ביטול</button>
            </div>
        </div>
    </div>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
