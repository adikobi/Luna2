<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>יומן</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/swiper/swiper-bundle.min.css" />
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/swiper/swiper-bundle.min.js"></script>
    <script src="js/main.js" defer></script>
</head>
<body>
    <!-- Password View -->
    <div id="password-view" class="view-screen">
        <div class="password-container">
            <h1>הזן קוד סודי</h1>
            <input type="password" id="password-input" inputmode="numeric" pattern="[0-9]*">
            <button id="password-submit-btn">כניסה</button>
        </div>
    </div>

    <!-- Journals List View (hidden by default) -->
    <div id="journals-list-view" class="view-screen" style="display: none;">
        <header>
            <h1>היומנים שלי</h1>
        </header>
        <main>
            <div id="journals-list-container">
                <!-- Dynamically populated -->
            </div>
            <div class="new-journal-form">
                <input type="text" id="new-journal-name" placeholder="שם יומן חדש">
                <button id="add-journal-btn">+</button>
            </div>
        </main>
    </div>

    <!-- Timeline View (hidden by default) -->
    <div id="timeline-view" class="view-screen" style="display: none;">
        <header id="timeline-header">
            <button id="back-to-journals-btn">&lt; חזרה</button>
            <h1 id="main-title"></h1> <!-- Title will be set dynamically -->
        </header>
        <main id="journal-feed">
            <!-- Journal Entry Cards will be populated here -->
        </main>
        <button id="fab">+</button>
    </div>

    <!-- Entry Composer View (Initially hidden) -->
    <div id="composer-view">
        <!-- Composer content will be added here -->
    </div>
</body>
</html>
