name: Deploy Luna to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Luna is a static site (no bundler). Ship only what the browser needs.
      - name: Assemble site
        run: |
          mkdir _site
          cp index.html _site/
          cp -r css js _site/
          touch _site/.nojekyll

      # Cheap guard: fail the build on a JS syntax error instead of shipping it.
      - name: Syntax check
        run: |
          for f in js/*.js; do node --check "$f"; done

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
